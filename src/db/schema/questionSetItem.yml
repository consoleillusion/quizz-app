---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Question Set Item"
type: "object"
additionalProperties: false
description: "Places one question at a position in a question set. question_id points into the table named by question_type."
required: ["question_set_id", "question_type", "question_id", "position"]
x-unique: [["question_set_id", "position"], ["question_set_id", "question_type", "question_id"]]
properties:
  question_set_id:
    type: "string"
    format: "uuid"
    x-references: "question_set"
  question_type: { $ref: "./common/schema.yml#/$defs/question_type" }
  question_id:
    type: "string"
    format: "uuid"
  position:
    type: "integer"
    minimum: 1
    description: "1-based position within the set."
