---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Question Multiselect"
type: "object"
additionalProperties: false
description: 'Multiple answers: the learner selects exactly s options. Exactly s options should carry positive points.'
required: []
properties:
  number_of_selections:
    type: "integer"
    description: "The number of selections required."
  options:
    type: "array"
    description: "The available answers."
    items:
      $ref: './common/schema.yml#/$defs/option'
  text:
    $ref: './common/schema.yml#/$defs/text'
  bloom:
    $ref: './common/schema.yml#/$defs/bloom'
  objectives:
    $ref: './common/schema.yml#/$defs/objectives'
  links:
    $ref: './common/schema.yml#/$defs/links'
