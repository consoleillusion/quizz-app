---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Question Multiselect"
x-question-type: "multiselect"
type: "object"
additionalProperties: false
description: "Multiple answers: the learner selects exactly number_of_selections options. That many options carry positive points."
required: ["text", "options", "number_of_selections"]
properties:
  text: { $ref: "./common/schema.yml#/$defs/text" }
  exhibit: { $ref: "./common/schema.yml#/$defs/exhibit" }
  number_of_selections:
    type: "integer"
    minimum: 2
    description: "The number of options the learner must select."
  options:
    type: "array"
    description: "The available answers, in authored order. The UI may shuffle them."
    minItems: 3
    items: { $ref: "./common/schema.yml#/$defs/option" }
  explanation: { $ref: "./common/schema.yml#/$defs/explanation" }
  bloom: { $ref: "./common/schema.yml#/$defs/bloom" }
  links: { $ref: "./common/schema.yml#/$defs/links" }
