---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Common"
$defs:
  text:
    type: string
    description: "The question text. Markdown. May contain code blocks."
    default: "''"
  bloom:
    type: "integer"
    minimum: 1
    maximum: 6
    description: 'The Bloom level the question intends to test: 1 remember, 2 understand, 3 apply, 4 analyze, 5 evaluate, 6 create.'
  option:
    type: "object"
    additionalProperties: false
    required: []
    properties:
      text:
        type: "string"
        description: "The option text shown to the user. Will be parsed as markdown."
        default: "''"
      explanation:
        type: "string"
        description: "Why this option is right or wrong."
      points:
        type: "number"
        description: "Points awarded when this option is selected. Correct options are positive; wrong options are 0 or negative."
  links:
    type: "array"
    description: "Useful links relevant to the topic"
    default: []
    items:
      type: "string"
      format: "uri"
  objectives:
    type: "array"
    description: "Objectives this question maps to, one entry per exam. Format EXAM-CODE:OBJECTIVE, for example 300-435:2.3."
    minItems: 1
    uniqueItems: true
    default: []
    items:
      type: "string"
      default: "''"
      pattern: ^[A-Za-z0-9-]+:[0-9]+(\.[0-9]+){1,3}$
