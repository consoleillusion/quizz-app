---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Common"
description: "Shared definitions. Not a table: loadSchema only reads the top-level *.yml files."
$defs:
  text:
    type: "string"
    minLength: 1
    description: "The question prompt. Markdown."
  exhibit:
    type: "string"
    description: "Optional preformatted exhibit (code, config, output) shown below the prompt. Slot markers ⟦1⟧, ⟦2⟧ … may appear here in slot-fill questions."
  explanation:
    type: "string"
    description: "Why the correct answer is correct, shown after the learner answers. Markdown."
  bloom:
    type: "integer"
    minimum: 1
    maximum: 6
    description: "The Bloom level the question intends to test: 1 remember, 2 understand, 3 apply, 4 analyze, 5 evaluate, 6 create."
  objectives:
    type: "array"
    description: "Objectives this question maps to, one entry per exam. Format EXAM-CODE:OBJECTIVE, for example 300-435:2.3."
    minItems: 1
    uniqueItems: true
    items:
      type: "string"
      pattern: "^[A-Za-z0-9-]+:[0-9]+(\\.[0-9]+){1,3}$"
  links:
    type: "array"
    description: "Useful links relevant to the topic."
    default: []
    items:
      type: "string"
      format: "uri"
  strings:
    type: "array"
    minItems: 2
    items:
      type: "string"
      minLength: 1
  option:
    type: "object"
    additionalProperties: false
    required: ["text", "points"]
    properties:
      text:
        type: "string"
        minLength: 1
        description: "The option text shown to the learner. Markdown."
      points:
        type: "number"
        description: "Points awarded when this option is selected. Correct options are positive; wrong options are 0 or negative."
      explanation:
        type: "string"
        description: "Why this option is right or wrong."
  question_type:
    type: "string"
    description: "Which question table the question lives in."
    enum: ["multichoice", "multiselect", "match", "order", "slotfill", "open"]
