---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Quiz"
type: "object"
additionalProperties: false
description: "A named collection of questions. Questions are chosen explicitly (quiz_question, ordered) and/or by tag rules (quiz_rule); any question can be in any number of quizzes."
required: ["slug", "title"]
x-unique: [["slug"]]
properties:
  slug:
    type: "string"
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: "URL-safe identifier, e.g. netconf or quiz-3. Used in the quiz's URL, /quiz/<slug>."
  title:
    type: "string"
    minLength: 1
  description:
    type: "string"
    default: ""
    x-widget: "textarea"
  exam:
    type: "string"
    description: "Exam code the set targets, e.g. 300-435."
    default: ""
  difficulty:
    type: "string"
    default: ""
  randomize_question_order:
    type: "boolean"
    default: false
  randomize_option_order:
    type: "boolean"
    default: true
  rule_match:
    type: "string"
    enum: ["all", "any"]
    default: "all"
    description: "For quizzes with tag rules: include questions carrying all of the rule tags, or any one of them."
