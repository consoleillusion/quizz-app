---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Session"
type: "object"
additionalProperties: false
description: "A login session. The browser holds a random token in a cookie; only its SHA-256 is stored. public_key is the Ed25519 key the browser generated for this session; server_secret_key is the server's own, for signing replies."
required: ["user_id", "token_hash", "expires_at"]
x-unique: [["token_hash"]]
x-private: ["server_secret_key"]
properties:
  user_id:
    type: "string"
    format: "uuid"
    x-references: "user"
  token_hash:
    type: "string"
    pattern: "^[0-9a-f]{64}$"
  expires_at:
    type: "string"
    format: "date-time"
  public_key:
    description: "The session's public signing key, made fresh by the browser at each registration or login."
    $ref: "./common/jwk.yml"
  server_secret_key:
    description: "The server's secret signing key for this session (tweetnacl, base64url), made at registration or login. Its public half goes to the browser."
    type: "string"
    pattern: "^[A-Za-z0-9_-]{86}$"
