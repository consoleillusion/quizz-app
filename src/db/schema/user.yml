---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "User"
type: "object"
additionalProperties: false
required: ["username"]
x-unique: [["username"], ["email"]]
properties:
  email:
    description: "User's email"
    type: "string"
    format: "email"
  username:
    description: "User's preferred name"
    type: "string"
    minLength: 1
  public_key:
    description: "User's public key"
    $ref: "./common/jwk.yml"
