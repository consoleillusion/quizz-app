---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "User Answer"
type: "object"
additionalProperties: false
description: "One answer a user gave. The browser keeps the same records in IndexedDB; they're synced through /answer."
required:
  [
    "user_id",
    "question_type",
    "question_id",
    "answer",
    "points",
    "correct",
    "answered_at",
  ]
x-unique: [["user_id", "question_id", "answered_at"]]
properties:
  user_id:
    type: "string"
    format: "uuid"
    x-references: "user"
  quiz_id:
    type: "string"
    format: "uuid"
    x-references: "quiz"
    description: "The quiz the question was answered in, if any."
  question_type: { $ref: "./common/schema.yml#/$defs/question_type" }
  question_id:
    type: "string"
    format: "uuid"
  answer:
    type: "array"
    description: "Option indexes (multichoice, multiselect), response or item indexes (match, order), tokens (slotfill) or the typed value (open)."
  points:
    type: "number"
    description: "Points awarded."
  correct:
    type: "boolean"
    description: "Whether the answer was fully correct."
  answered_at:
    type: "string"
    format: "date-time"
