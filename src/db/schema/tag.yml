---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Tag"
type: "object"
additionalProperties: false
description: "A typed label for questions and quizzes. Names are namespaced from the vendor down, so exams from different vendors never clash."
required: ["type", "name"]
x-unique: [["type", "name"]]
properties:
  type:
    type: "string"
    enum: ["vendor", "exam", "domain", "objective", "topic", "generic"]
    description: "What kind of tag this is."
  name:
    type: "string"
    minLength: 1
    maxLength: 100
    description: "vendor: cisco. exam: cisco:300-435. domain: cisco:300-435:5.0. objective: cisco:300-435:5.4. topic and generic: lower-case words joined by dashes, e.g. fastmcp."
  description:
    type: "string"
    default: ""
    description: "Human-readable meaning, e.g. the blueprint wording of an objective."
allOf:
  - if: { properties: { type: { type: "string", const: "vendor" } } }
    then: { properties: { name: { type: "string", pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" } } }
  - if: { properties: { type: { type: "string", const: "exam" } } }
    then: { properties: { name: { type: "string", pattern: "^[a-z0-9-]+:[a-z0-9.-]+$" } } }
  - if: { properties: { type: { type: "string", const: "domain" } } }
    then:
      { properties: { name: { type: "string", pattern: "^[a-z0-9-]+:[a-z0-9.-]+:[0-9]+\\.0$" } } }
  - if: { properties: { type: { type: "string", const: "objective" } } }
    then:
      {
        properties:
          { name: { type: "string", pattern: "^[a-z0-9-]+:[a-z0-9.-]+:[0-9]+(\\.[0-9]+){1,3}$" } },
      }
  - if: { properties: { type: { type: "string", enum: ["topic", "generic"] } } }
    then: { properties: { name: { type: "string", pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" } } }
