---
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Question Multichoice"
x-question-type: "multichoice"
type: "object"
additionalProperties: false
description: "Single answer: the learner selects exactly one option. Exactly one option carries positive points."
required: ["text", "options", "objectives"]
properties:
  text: { $ref: "./common/schema.yml#/$defs/text" }
  exhibit: { $ref: "./common/schema.yml#/$defs/exhibit" }
  options:
    type: "array"
    description: "The available answers, in authored order. The UI may shuffle them."
    minItems: 2
    items: { $ref: "./common/schema.yml#/$defs/option" }
  explanation: { $ref: "./common/schema.yml#/$defs/explanation" }
  objectives: { $ref: "./common/schema.yml#/$defs/objectives" }
  bloom: { $ref: "./common/schema.yml#/$defs/bloom" }
  links: { $ref: "./common/schema.yml#/$defs/links" }
