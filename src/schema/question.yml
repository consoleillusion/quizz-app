$schema: https://json-schema.org/draft/2020-12/schema
title: Question
type: object
additionalProperties: false
description: >
  One question. What is common to every type (prompt, exhibit, explanation and
  ratings) is a column; what differs by type is in `body`, whose shape is
  checked against its type. Each question carries at least one tag. Questions
  belong to whoever wrote them, and can be shared or made public; anyone,
  signed in or not, can read public questions.
x-access:
  read: public
  shareable: true
  visibility: [private, shared, authenticated, public]
properties:
  type:
    type: string
    enum: [multichoice, multiselect, match, order, slotfill, open]
  text:
    type: string
    minLength: 1
    description: The prompt. Markdown; code in `backticks` or a fenced block.
  exhibit:
    type: string
    description: Optional preformatted exhibit (code, config, output) shown below the prompt. Slot markers ⟦1⟧, ⟦2⟧ … may appear here in slotfill questions.
  explanation:
    type: string
    description: Why the correct answer is correct, shown after the learner answers. Markdown.
  author:
    type: string
    maxLength: 100
    description: Who wrote the question, such as a person or the model that generated it.
  bloom:
    type: integer
    minimum: 1
    maximum: 6
    description: "Bloom level: 1 remember, 2 understand, 3 apply, 4 analyze, 5 evaluate, 6 create."
  difficulty:
    type: integer
    minimum: 1
    maximum: 5
    description: "1 very easy to 5 very hard."
  links:
    type: array
    default: []
    items:
      type: string
      format: uri
  body:
    description: The type's own fields. body.type must equal type.
    oneOf:
      - $ref: "#/$defs/multichoice"
      - $ref: "#/$defs/multiselect"
      - $ref: "#/$defs/match"
      - $ref: "#/$defs/order"
      - $ref: "#/$defs/slotfill"
      - $ref: "#/$defs/open"
required: [type, text, body]
x-checks:
  - "json_extract(`body`, '$.type') = `type`"
x-relations:
  tags:
    table: tag
    cardinality: many
    through: question_tag
    required: true
    x-link-any: true
$defs:
  strings:
    type: array
    minItems: 2
    items: { type: string, minLength: 1 }
  option:
    type: object
    additionalProperties: false
    required: [text, points]
    properties:
      text: { type: string, minLength: 1 }
      points: { type: number, description: "Points for choosing it: positive when correct, 0 or negative when not." }
      explanation: { type: string }
  indexes:
    type: array
    minItems: 2
    uniqueItems: true
    items: { type: integer, minimum: 0 }
  multichoice:
    type: object
    description: Exactly one option carries positive points.
    additionalProperties: false
    required: [type, options]
    properties:
      type: { const: multichoice }
      options: { type: array, minItems: 2, items: { $ref: "#/$defs/option" } }
  multiselect:
    type: object
    description: Exactly number_of_selections options carry positive points.
    additionalProperties: false
    required: [type, options, number_of_selections]
    properties:
      type: { const: multiselect }
      number_of_selections: { type: integer, minimum: 2 }
      options: { type: array, minItems: 3, items: { $ref: "#/$defs/option" } }
  match:
    type: object
    description: For each prompt, answer holds the index of its response.
    additionalProperties: false
    required: [type, prompts, responses, answer]
    properties:
      type: { const: match }
      prompts: { $ref: "#/$defs/strings" }
      responses: { $ref: "#/$defs/strings" }
      answer: { $ref: "#/$defs/indexes" }
  order:
    type: object
    description: answer holds item indexes in the correct sequence.
    additionalProperties: false
    required: [type, items, answer]
    properties:
      type: { const: order }
      items: { $ref: "#/$defs/strings" }
      answer: { $ref: "#/$defs/indexes" }
  slotfill:
    type: object
    description: Slots ⟦1⟧, ⟦2⟧ … are filled from a shared token bank.
    additionalProperties: false
    required: [type, tokens, gaps]
    properties:
      type: { const: slotfill }
      reuse_tokens: { type: boolean, default: true }
      tokens: { type: array, minItems: 2, uniqueItems: true, items: { type: string, minLength: 1 } }
      gaps:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [accepted_tokens]
          properties:
            accepted_tokens: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
            points: { type: number, default: 1 }
            explanation: { type: string }
  open:
    type: object
    description: The learner types the answer.
    additionalProperties: false
    required: [type, answers]
    properties:
      type: { const: open }
      answer_type: { type: string, enum: [string, number, integer], default: string }
      case_sensitive: { type: boolean, default: false }
      answers: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
